<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Golden Ring of Champions -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="12 8" opacity="0.8"/>

  <!-- Stylized Football Ball & G Monogram -->
  <circle cx="256" cy="256" r="120" fill="#090d16" stroke="url(#goldGrad)" stroke-width="10"/>

  <!-- Football Pentagon Pattern Center -->
  <polygon points="256,196 294,224 280,268 232,268 218,224" fill="url(#goldGrad)"/>
  <polygon points="256,196 256,146 298,162 294,224" fill="#1e293b"/>
  <polygon points="294,224 340,214 354,258 280,268" fill="#334155"/>
  <polygon points="280,268 300,314 256,334 232,268" fill="#1e293b"/>
  <polygon points="232,268 212,314 170,296 218,224" fill="#334155"/>
  <polygon points="218,224 172,214 186,162 256,146" fill="#1e293b"/>

  <!-- Live Pulse Dot at top right -->
  <circle cx="380" cy="132" r="24" fill="#ef4444"/>
  <circle cx="380" cy="132" r="32" fill="none" stroke="#ef4444" stroke-width="6" opacity="0.7"/>

  <!-- Letter G Accent Mark in Center -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#f8fafc" text-anchor="middle" letter-spacing="4">GOLAZO</text>
  <text x="256" y="456" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#fbbf24" text-anchor="middle" letter-spacing="6">LIVE</text>
</svg>
